<eui-dialog
  #sendMilestonePublishToDgTemplateCatalog
  [title]="'page.collection.milestones.publish-to-catalog.title' | translate"
  [isHandleCloseOnDismiss]="true"
  [isHandleCloseOnEscape]="true"
  [isHandleCloseOnClose]="true"
  (clickOutside)="close()"
  (dismiss)="close()"
  (escape)="close()"
  (dialogClose)="close()"
>
  <!-- Body -->
  <div [formGroup]="targetUserForm">

    <div euiInputGroup class="row eui-u-flex-justify-content-center">
      <div class="col-md-3">
        <label euiLabel for="templateName">
          {{ 'page.collection.milestones.publish-to-catalog.template-name' | translate }}
        </label>
      </div>
      <div class="col-md-9">
        <input
          euiInputText
          id="templateName"
          type="text"
          formControlName="templateName"
        />
        <div class="eui-field-error" *ngIf="showTemplateNameError">
          {{ 'validation.required' | translate }}
        </div>
      </div>
    </div>

    <div euiInputGroup class="row eui-u-flex-justify-content-center">
      <div class="col-md-3">
        <label euiLabel for="dgSearch">
          {{ 'page.collection.milestones.publish-to-catalog.template-visibility' | translate }}
        </label>
      </div>
      <div class="col-md-9">
        <!-- Small helper text -->
        <small class="eui-field-description">
          {{ 'page.collection.milestones.publish-to-catalog.visibility' | translate }}
          <!-- Or hardcode: My DG and DG(s) -->
        </small>

        <eui-autocomplete
          #dgAuto
          id="dgSearch"
          [autocompleteData]="filteredDgItems"
          [placeholder]="'Search DGs…'"
          formControlName="dgSearch"
          (inputChange)="onDgSearch($event)"
          (clear)="onDgSearch('')">
        </eui-autocomplete>

        <div class="eui-u-mt-2xs selected-chips">
      <span class="chip" *ngFor="let dg of selectedDgs; let i = index" (click)="removeDg(i)" title="Remove">
        {{ dg.label }} <span class="chip-x" aria-hidden="true">×</span>
      </span>
        </div>

        <input type="hidden" formControlName="dgCodes" />
        <div class="eui-field-error" *ngIf="showDgError">
          {{ 'validation.required' | translate }}
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <eui-dialog-footer>
    <div class="eui-u-display-flex eui-u-flex-row eui-u-flex-justify-content-end">
      <button type="button" class="eui-u-mr-xs" euiButton euiSecondary (click)="close()">
        {{ 'global.actions.cancel' | translate }}
      </button>
      <button [disabled]="!isFormValid" type="button" euiButton euiPrimary (click)="publishTemplate()">
        {{ 'page.collection.milestones.publish-to-catalog.publish' | translate }}
      </button>
    </div>
  </eui-dialog-footer>
</eui-dialog>
