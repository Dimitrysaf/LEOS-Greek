<form [formGroup]="createForm">
  <eui-dialog
    #editTitleDialog
    [title]="'page.collection.proposal-header.edit-title-dialog.title' | translate">
    <div euiInputGroup class="flex-row">
      <label class="label">
        {{'page.collection.proposal-header.edit-title-dialog.label' | translate }}
      </label>
      <div class="d-flex flex-wrap">
        <span>{{ nonEditablePartOfTitle }}</span>
        <input euiInputText
               formControlName="docPurpose"/>
      </div>
    </div>
    <eui-dialog-footer>
      <div class="d-flex flex-row justify-content-end">
        <button euiButton euiSecondary (click)="closeDialog()">
          {{ 'global.actions.cancel' | translate }}
        </button>
        <button
          euiButton
          euiPrimary
          (click)="handleSave()"
          [disabled]="!isFormValid()"
          class="save-button"
        >
          {{ 'global.actions.save' | translate }}
        </button>
      </div>
    </eui-dialog-footer>
  </eui-dialog>
</form>
