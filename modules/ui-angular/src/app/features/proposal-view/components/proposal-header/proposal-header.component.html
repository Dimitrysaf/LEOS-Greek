<header class="eui-u-flex eui-u-flex-align-items-start eui-u-mb-l">
  <h1 class="flex-grow-1 eui-u-font-2xl">
    {{ nonEditablePartOfTitle }} {{ editableTitle }}
  </h1>

  <button
    euiButton
    euiSizeS
    euiOutline
    euiPrimary
    class="eui-u-ml-s"
    (click)="handleEdit()"
  >
    Edit
  </button>

  <eui-dialog #editTitle title="Edit title">
    <div euiInputGroup class="flex-row">
      <label class="label"> New title</label>
      <div class="d-flex flex-wrap">
        <span>{{ nonEditablePartOfTitle }}</span>
        <input euiInputText [(ngModel)]="title" />
      </div>
    </div>
    <eui-dialog-footer>
      <div class="d-flex flex-row justify-content-end">
        <button euiButton euiSecondary (click)="handleClose()">Cancel</button>
        <button euiButton euiPrimary (click)="handleSave()" class="save-button">
          Save
        </button>
      </div>
    </eui-dialog-footer>
  </eui-dialog>

  <app-proposal-actions-dropdown
    class="eui-u-ml-s"
  ></app-proposal-actions-dropdown>
</header>
