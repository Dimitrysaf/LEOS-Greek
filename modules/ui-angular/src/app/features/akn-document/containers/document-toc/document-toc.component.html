<div class="toc-container">
  <div id="treeContainer" class="tree-container" cdkScrollable #treeContainer>
    <mat-tree
      id="tree"
      cdkDropList
      #tree="cdkDropList"
      *ngIf="isVisible"
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      (cdkDropListDropped)="onDrop($event)"
      [cdkDropListSortingDisabled]="true"
      [cdkDropListDisabled]="!isEditMode"
    >
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.shouldRenderNode"
        (cdkDragMoved)="dragMoved($event)"
        [attr.data-id]="node.id"
        *matTreeNodeDef="let node"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        [cdkDragData]="getDraggedNodes(node)"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEditMode || !this.isDraggable(node)"
      >
        <div *cdkDragPreview>
          <html>
          <head>
            <style>
              .dragged-selected-node {
                background-color: #7bd2f6 !important;
                border-radius: 2rem;
              }

              .dragged-label {
                display: block;
                flex-grow: 1;
                max-width: 300px;
                padding: 5px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--mat-tree-node-text-color);
                font-family: var(--mat-tree-node-text-font);
                font-size: var(--mat-tree-node-text-size);
                font-weight: var(--mat-tree-node-text-weight);
              }
            </style>
          </head>
          <body>
          <div *ngFor="let selectedNode of this.selectedNodesArray"
               [class]="'dragged-selected-node' + ' ' + 'dragged-label'"
               [innerHTML]="getNodeLabel(selectedNode.label)"
          ></div>
          </body>
          </html>
        </div>
        <div class="drop-placeholder"></div>

        <li class="node-li" *ngIf="shouldBeVisible(node)">
          <app-co-edition-info *ngIf="shouldBeVisible(node)" [nodeId]="node.id"></app-co-edition-info>
          <div
            class="mat-tree-node"
            [class]="{ 'selected-node': isSelected(node) }"
            (click)="handleNodeSelect(node, $event)"
          >
            <eui-icon-svg
              size="s"
              icon="eui-chevron-forward"
              class="eui-u-visibility-hidden"
            ></eui-icon-svg>
            <div
              [id]="'node-label-' + node.id"
              [class]="'label' + ' ' + getNodeStyling(node)"
              [innerHTML]="getNodeLabel(node.label)"
              [euiTooltip]="getNodeTooltip(node)"
              [position]="
                isLabelTextMoreThanOneLine(node.label) ? 'right' : 'above'
              "
            ></div>
            <app-toc-action-menu [node]="node" [blockMoveOrDelete]="blockMoveOrDelete(node)"> </app-toc-action-menu>
          </div>
        </li>
        <div class="drop-placeholder"></div>
      </mat-nested-tree-node>
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.shouldRenderNode && !hasChildren"
        *matTreeNodeDef="let node; when: hasChildren"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        [attr.data-id]="node.id"
        [cdkDragData]="getDraggedNodes(node)"
        (cdkDragMoved)="dragMoved($event)"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEditMode"
      >
        <div *cdkDragPreview>

          <html>
          <head>
            <style>
              .dragged-selected-node {
                background-color: #7bd2f6 !important;
                border-radius: 2rem;
              }

              .dragged-label {
                display: block;
                flex-grow: 1;
                max-width: 300px;
                padding: 5px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--mat-tree-node-text-color);
                font-family: var(--mat-tree-node-text-font);
                font-size: var(--mat-tree-node-text-size);
                font-weight: var(--mat-tree-node-text-weight);
              }
            </style>
          </head>
          <body>
          <div *ngFor="let selectedNode of this.selectedNodes.values()"
               [class]="'dragged-selected-node' + ' ' + 'dragged-label'"
               [innerHTML]="getNodeLabel(selectedNode.label)"
          ></div>
          </body>
          </html>
        </div>
        <div *ngIf="node.shouldRenderNode" class="drop-placeholder"></div>

        <li *ngIf="node.shouldRenderNode">
          <app-co-edition-info [nodeId]="node.id"></app-co-edition-info>
          <div
            (click)="handleNodeSelect(node, $event)"
            class="mat-tree-node"
            [class]="{ 'selected-node': isSelected(node) }"
          >
            <eui-icon-svg
              size="s"
              *ngIf="!treeControl.isExpanded(node)"
              icon="eui-chevron-forward"
              (click)="nodeExpanded(node)"
            ></eui-icon-svg>
            <eui-icon-svg
              size="s"
              *ngIf="treeControl.isExpanded(node)"
              icon="eui-chevron-down"
              (click)="nodeCollapsed(node)"
            ></eui-icon-svg>
            <div
              [id]="'node-label-' + node.id"
              [class]="'label-extended' + ' ' + getNodeStyling(node)"
              (click)="handleNodeSelect(node, $event)"
              [innerHTML]="getNodeLabel(node.label)"
              [euiTooltip]="getNodeTooltip(node)"
              [position]="
                isLabelTextMoreThanOneLine(node.label) ? 'right' : 'above'
              "
            ></div>
            <app-toc-action-menu [node]="node"> </app-toc-action-menu>
          </div>
          <ul class="">
            <div *ngIf="treeControl.isExpanded(node)">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </ul>
        </li>
        <div *ngIf="node.shouldRenderNode" class="drop-placeholder"></div>
        <ul *ngIf="!node.shouldRenderNode" class="">
          <div>
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </ul>
      </mat-nested-tree-node>
    </mat-tree>

    <!-- selected element show -->
  </div>
  <div class="eui-u-display-flex eui-u-flex-column eui-u-p-xs eui-u-font-s" *ngIf="isEditMode && !isTreeValidationWarning">
    <span
      euiLabel
      [euiDanger]="!isDropValid"
      [euiSuccess]="isDropValid"
      euiSizeL
      class="text-wrap"
      [innerHTML]="messageFromValidation"
    ></span>
  </div>
  <ul *ngIf="isTreeValidationWarning">
    <li *ngFor="let warning of warningMessagesFromValidation">
      <div class="eui-u-display-flex eui-u-flex-column eui-u-p-xs eui-u-font-xs eui-u-border-bottom-separator eui-u-border-state-warning">
      <span euiLabel
            [euiWarning]="isTreeValidationWarning"
            euiSizeS
            class="text-wrap"
            [innerHTML]="warning">
      </span>
      </div>
    </li>
  </ul>
  <ul *ngIf="isSelectionWarning">
      <div class="eui-u-display-flex eui-u-flex-column eui-u-p-xs eui-u-font-xs eui-u-border-bottom-separator eui-u-border-state-warning">
      <span euiLabel
            [euiWarning]="isTreeValidationWarning"
            euiSizeS
            class="text-wrap"
            [innerHTML]="warningMessagesFromSelection">
      </span>
      </div>
  </ul>
  <app-confirm-delete-dialog
    #deleteTocConfirmation
    [title]="'toc.edit.window.item.selected.delete-dialog.title' | translate"
    [description]="
      'toc.edit.window.item.selected.delete-dialog.desc' | translate
    "
  ></app-confirm-delete-dialog>
</div>
