<div class="toc-container">
  <div id="treeContainer" class="tree-container" cdkScrollable #treeContainer>
    <mat-tree
      id="tree"
      cdkDropList
      #tree="cdkDropList"
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      (cdkDropListDropped)="onDrop($event)"
      [cdkDropListSortingDisabled]="true"
      [cdkDropListDisabled]="!isEdit"
    >
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.shouldRenderNode"
        (cdkDragMoved)="dragMoved($event)"
        [attr.data-id]="node.id"
        *matTreeNodeDef="let node"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        [cdkDragData]="node"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEdit || !node.tocItem.draggable"
      >
        <div class="drop-placeholder"></div>
        <li class="node-li">
          <div
            class="mat-tree-node"
            [class]="{ 'selected-node': selectedNode?.id === node.id }"
            (click)="handleNodeSelect(node)"
          >
            <eui-icon
              euiSizeS
              iconClass="eui-icon-angle-right"
              class="eui-u-visibility-hidden"
            ></eui-icon>
            <div
              [id]="'node-label-' + node.id"
              [class]="'label' + ' ' + node.tocStyling"
              [innerHTML]="node.label"
              [euiTooltip]="getNodeTooltip(node)"
              [position]="
                isLabelTextMoreThanOneLine(node.label) ? 'right' : 'above'
              "
            ></div>
            <app-node-toc-actions
              [isEditMode]="isEdit"
              [isNodeSelectedToMove]="selectedNodeToMove !== null"
              [node]="node"
              (handleMove)="handleMove(node)"
              (handlePlaceAt)="handlePlaceAt(node, $event)"
              (handleCancelMove)="handleCancelMove()"
            >
            </app-node-toc-actions>
          </div>
        </li>
        <div class="drop-placeholder"></div>
      </mat-nested-tree-node>
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.shouldRenderNode"
        *matTreeNodeDef="let node; when: hasChildren"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        [attr.data-id]="node.id"
        [cdkDragData]="node"
        (cdkDragMoved)="dragMoved($event)"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEdit"
      >
        <div class="drop-placeholder"></div>
        <li>
          <div
            class="mat-tree-node"
            [class]="{ 'selected-node': selectedNode?.id === node.id }"
          >
            <eui-icon
              euiSizeS
              *ngIf="!treeControl.isExpanded(node)"
              iconClass="eui-icon-angle-right"
              (click)="nodeExpanded(node)"
            ></eui-icon>
            <eui-icon
              euiSizeS
              *ngIf="treeControl.isExpanded(node)"
              iconClass="eui-icon eui-icon-angle-down"
              (click)="nodeCollapsed(node)"
            ></eui-icon>
            <div
              [id]="'node-label-' + node.id"
              [class]="'label-extended' + ' ' + node.tocStyling"
              (click)="handleNodeSelect(node)"
              [innerHTML]="node.label"
              [euiTooltip]="getNodeTooltip(node)"
              [position]="
                isLabelTextMoreThanOneLine(node.label) ? 'right' : 'above'
              "
            ></div>
            <app-node-toc-actions
              [isEditMode]="isEdit"
              [isNodeSelectedToMove]="selectedNodeToMove !== null"
              [node]="node"
              (handleMove)="handleMove(node)"
              (handlePlaceAt)="handlePlaceAt(node, $event)"
              (handleCancelMove)="handleCancelMove()"
            >
            </app-node-toc-actions>
          </div>
          <ul class="">
            <div *ngIf="treeControl.isExpanded(node)">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </ul>
        </li>
        <div class="drop-placeholder"></div>
      </mat-nested-tree-node>
    </mat-tree>
  </div>

  <!-- validation message -->
  <div class="d-flex flex-column p-2 eui-u-font-s" *ngIf="isEdit">
    <span
      euiLabel
      [euiDanger]="!isDropValid"
      [euiSuccess]="isDropValid"
      euiSizeL
      class="text-wrap"
      [innerHTML]="messageFromValidation"
    >
    </span>
  </div>
  <!-- selected element show -->
  <div class="d-flex flex-column eui-u-font-s" *ngIf="isEdit && selectedNode">
    <app-toc-editor
      [documentType]="documentType"
      [toc]="this.treeControl.dataNodes"
      [tocItems]="tocItems"
      [selectedNode]="selectedNode"
      [documentConfig]="documentConfig"
      (handleTocRemove)="handleTocRemove()"
      (handleNodeChangesEvent)="handleNodeChanges($event)"
      (handleInvalidNodes)="handleInvalidNodes($event)"
    ></app-toc-editor>
  </div>
</div>

<app-confirm-delete-dialog
  #deleteTocConfirmation
  [title]="'toc.edit.window.item.selecdted.delete-dialog.title' | translate"
  [description]="
    'toc.edit.window.item.selecdted.delete-dialog.desc' | translate
  "
></app-confirm-delete-dialog>
