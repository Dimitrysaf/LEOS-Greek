<div
  class="main-container"
  [ngClass]="containerClass"
  [ngStyle]="{ 'padding-left': paddingLeft }"
>
  <div
    [id]="containerId"
    class="document-container"
    [ngStyle]="documentStyle"
    #container
  >
    <!-- Document xml goes here -->
  </div>
</div>
<div #zoomScrollbar>
  <app-zoom-scrollbar
    [zoomLevel]="zoomLevel"
    (zoomChange)="handleZoomChange($event)"
  ></app-zoom-scrollbar>
</div>
<app-track-changes-actions></app-track-changes-actions>
