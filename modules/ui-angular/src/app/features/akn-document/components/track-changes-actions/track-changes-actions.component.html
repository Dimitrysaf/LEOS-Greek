<div [style]="locationCss" class="tc_panel tc_menu_panel">
  <button
    class="tc_menuitem tc_menubutton"
    width="100%"
    euiButton
    euiIconButton
    euiBasicButton
    [title]="(isAI()? 'page.editor.track.changes.actions.accept.ai' : 'page.editor.track.changes.actions.accept') | translate"
    [attr.aria-label]="(isAI()? 'page.editor.track.changes.actions.accept.ai' : 'page.editor.track.changes.actions.accept') | translate"
    [disabled]="!this.canAcceptTrackChanges"
    (click)="onAccept()"
  >
    <img src="assets/images/ok.png" alt="" />
    <span class="tc_menubutton_label">{{
        (isAI()? 'page.editor.track.changes.actions.accept.ai' : 'page.editor.track.changes.actions.accept') | translate
    }}</span>
  </button>
  <button
    class="tc_menuitem tc_menubutton"
    width="100%"
    euiButton
    euiIconButton
    euiBasicButton
    [title]="(isAI()? 'page.editor.track.changes.actions.reject.ai' : 'page.editor.track.changes.actions.reject') | translate"
    [attr.aria-label]="(isAI()? 'page.editor.track.changes.actions.reject.ai' : 'page.editor.track.changes.actions.reject') | translate"
    [disabled]="!this.canRejectTrackChanges"
    (click)="onReject()"
  >
    <img src="assets/images/remove.png" alt="" />
    <span class="tc_menubutton_label">{{
        (isAI()? 'page.editor.track.changes.actions.reject.ai' : 'page.editor.track.changes.actions.reject') | translate
    }}</span>
  </button>
</div>
