<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="'page.editor.search-button.tooltip' | translate"
  [attr.aria-label]="'page.editor.search-button.tooltip' | translate"
  (click)="doc.toggleSearchPane()"
>
  <span class="eui-icon eui-icon-search"></span>
</button>

<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="'page.editor.reload-button.tooltip' | translate"
  [attr.aria-label]="'page.editor.reload-button.tooltip' | translate"
  (click)="doc.reloadDocument()"
>
  <span class="eui-icon eui-icon-refresh"></span>
</button>

<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="annotationsTooltip$ | async"
  [attr.aria-label]="annotationsTooltip$ | async"
  (click)="doc.toggleAnnotations()"
>
  <span
    class="eui-icon eui-icon-comment"
    [class.eui-u-color-grey-50]="(doc.annotationsEnabled$ | async) === false"
  ></span>
</button>

<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="highlightsTooltip$ | async"
  [attr.aria-label]="highlightsTooltip$ | async"
  (click)="doc.toggleHighlights()"
>
  <span
    class="eui-icon"
    [class.eui-u-color-grey-50]="!highlightsEnabled"
    [ngClass]="
      highlightsEnabled ? 'eui-icon-visibility' : 'eui-icon-visibility-off'
    "
  ></span>
</button>

<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="guidelinesTooltip$ | async"
  [attr.aria-label]="guidelinesTooltip$ | async"
  (click)="doc.toggleGuidelines()"
>
  <span
    class="eui-icon eui-icon-sitemap"
    [class.eui-u-color-grey-50]="!guidelinesEnabled"
  ></span>
</button>

<button
  euiButton
  euiIconButton
  euiSecondary
  euiOutline
  [title]="'page.editor.create-note-button.tooltip' | translate"
  [attr.aria-label]="'page.editor.create-note-button.tooltip' | translate"
  (click)="doc.createNote()"
>
  <span class="eui-icon eui-icon-file"></span>
</button>
