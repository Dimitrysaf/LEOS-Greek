<eui-dropdown-button-menu
  #dropdownComponentRef
  [menuItems]="menuItems"
  *ngIf="isEditMode && !node.tocItem.root"
>
  <button
    euiButton
    euiRounded
    euiIconButton
    euiBasicButton
    euiSecondary
    euiSizeS
    (click)="onMenuIconClick()"
  >
    <span euiSizeS euiIcon iconClass="eui-icon eui-icon-more-vertical"></span>
  </button>
</eui-dropdown-button-menu>
