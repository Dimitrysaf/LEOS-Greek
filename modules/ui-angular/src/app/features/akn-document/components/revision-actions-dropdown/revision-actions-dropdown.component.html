<eui-dropdown isDropDownRightAligned>
    <button
            euiButton
            euiBasicButton
            euiRounded
            euiIconButton
            euiSizeS
            [title]="'page.editor.contribution.actions-button.tooltip' | translate"
            [attr.aria-label]="
      'page.editor.contribution.actions-button.tooltip' | translate
    "
    >
        <span euiIcon iconClass="eui-icon-more-vertical"></span>
    </button>
    <eui-dropdown-content>
        <div euiList>
            <!-- Mark as Processed button-->
            <button
                    euiListItem
                    *ngIf="true"
                    [disabled]="
                  mergeContributionsService.isContributionDeclinedOrProcessed$ | async
                "
                    translate="page.editor.contribution.view.actions.processed"
                    (click)="onClickMarkAsProcessed(contribution)"
            ></button>
            <!-- Apply All Changes -->
            <button
                    euiListItem
                    *ngIf="true"
                    [disabled]="true"
                    translate="page.editor.contribution.view.actions.apply.all.changes"
                    (click)="onClickApplyAllChanges(contribution)"
            ></button>
            <!-- Apply All With TC -->
            <button
                    euiListItem
                    *ngIf="true"
                    [disabled]="true"
                    translate="page.editor.contribution.view.actions.apply.all.with.track.changes"
                    (click)="onClickApplyAllChangesWithTC(contribution)"
            ></button>
            <!-- Send feedback button -->
            <button
                    euiListItem
                    *ngIf="true"
                    [disabled]="true"
                    translate="page.editor.contribution.actions.send.feedback"
                    (click)="onClickSendFeedback(contribution)"
            ></button>
        </div>
    </eui-dropdown-content>
</eui-dropdown>

<eui-dialog
    #declineContributionDialog
    [title]="'page.editor.contribution.decline.modal-title' | translate"
    [acceptLabel]="'page.editor.contribution.decline.modal-button' | translate"
    [dismissLabel]="'global.actions.cancel' | translate"
    [width]="'25vw'"
    [isHandleCloseOnAccept]="true"
    [isHandleCloseOnDismiss]="true"
    [hasCloseButton]="false"
    (clickOutside)="onCancel()"
    (close)="onCancel()"
    (accept)="onAccept()"
    (dismiss)="onCancel()"
>
    <p>{{ versionModalText }}</p>
    <p class="eui-u-mb-s">
        {{ 'page.editor.contribution.decline.modal-text' | translate }}
    </p>
</eui-dialog>
<eui-dialog
    #markContributionAsProcessedDialog
    [title]="
    'page.editor.contribution.view.mark-contribution-as-processed.modal-title'
      | translate
  "
    [acceptLabel]="'global.actions.continue' | translate"
    [dismissLabel]="'global.actions.cancel' | translate"
    [width]="'25vw'"
    [isHandleCloseOnAccept]="true"
    [isHandleCloseOnDismiss]="true"
    [hasCloseButton]="false"
    (clickOutside)="onCancelMarkContributionAsProcessed()"
    (close)="onCancelMarkContributionAsProcessed()"
    (accept)="onAcceptMarkContributionAsProcessed()"
    (dismiss)="onCancelMarkContributionAsProcessed()"
>
    <p class="eui-u-mb-s">
        {{
        'page.editor.contribution.view.mark-contribution-as-processed.modal-text'
            | translate
        }}
    </p>
</eui-dialog>
