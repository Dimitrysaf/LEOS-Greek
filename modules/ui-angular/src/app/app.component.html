<eui-app [userInfos]="userInfos?.fullName" isSidebarOpen="true">
  <eui-app-toolbar>
    <eui-toolbar>
      <eui-toolbar-logo></eui-toolbar-logo>
      <eui-toolbar-app [appName]="appTitle"></eui-toolbar-app>
      <eui-toolbar-items euiPositionRight>
        <eui-toolbar-item-user-profile>
          <eui-user-profile-menu>
            <eui-user-profile-menu-item>
              <eui-icon iconClass="eui-icon-person-thin"></eui-icon>
              {{ 'eui.my-profile-informations' | translate }}
            </eui-user-profile-menu-item>
            <eui-user-profile-menu-item>
              <eui-icon iconClass="eui-icon-logout-thin"></eui-icon>
              {{ 'eui.sign-out' | translate }}
            </eui-user-profile-menu-item>
          </eui-user-profile-menu>
        </eui-toolbar-item-user-profile>
      </eui-toolbar-items>
    </eui-toolbar>
  </eui-app-toolbar>
  <eui-app-footer [className]="'leos-footer'">
    <eui-footer euiPrimary [className]="'leos-footer-content'">
      Developed by DIGIT.B2 | Version: {{ 'NG_APP_LEOS_VERSION' | env }} |
      Revision: LEOS Open Source | Date:
      {{ 'NG_APP_LEOS_VERSION_BUILD_DATE' | env }}
    </eui-footer>
  </eui-app-footer>
</eui-app>
