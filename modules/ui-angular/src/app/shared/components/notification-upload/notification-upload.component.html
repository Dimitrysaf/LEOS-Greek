<form [formGroup]="uploadForm" enctype="multipart/form-data">
  <div class="button-text-container">
    <span>{{ 'app.notification.upload.label.text' | translate }}</span>
    <eui-file-upload
      #uploadFile
      formControlName="jsonFile"
      [isMultiple]="false"
      [accept]="'.json'"
      (fileDrop)="onDrop()"
      [hasResetButton]="false"
    ></eui-file-upload>
  </div>
</form>
<div class="app-dialog-footer-content">
  <button euiButton (click)="closeDialog()">
    {{ 'global.actions.cancel' | translate }}
  </button>
  <button euiButton euiPrimary [disabled]="!uploadForm.valid || !isValidFile" (click)="uploadNotifications()">
    {{ 'page.workspace.upload.notification.button.text' | translate }}
  </button>
</div>
<eui-card *ngIf="errorsVO && errorsVO.length > 0">
  <eui-card-header>
    <eui-card-header-title>
      <span>{{ fileName }}: Not Valid</span>
    </eui-card-header-title>
  </eui-card-header>
  <eui-card-content>
    <div class="error-messages">
      <ul>
        <li *ngFor="let error of errorsVO">
          {{ error.errorCode | translate }}: {{ error.objects.join(', ') }}
        </li>
      </ul>
    </div>
  </eui-card-content>
</eui-card>
