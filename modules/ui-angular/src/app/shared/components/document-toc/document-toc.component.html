<div class="toc-container h-100 flex flex-column justify-content-between">
  <div class="tree-container" cdkScrollable>
    <mat-tree
      id="tree"
      cdkDropList
      #tree="cdkDropList"
      [dataSource]="dataSource"
      [treeControl]="treeControl"
      (cdkDropListDropped)="onDrop($event)"
      [cdkDropListSortingDisabled]="true"
      [cdkDropListDisabled]="!isEditMode()"
    >
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.tocItem.display"
        (cdkDragMoved)="dragMoved($event)"
        [attr.data-id]="node.id"
        *matTreeNodeDef="let node"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        (cdkDragStarted)="onDragStart($event)"
        [cdkDragData]="node"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEditMode()"
      >
        <li class="node-li">
          <div class="mat-tree-node" (click)="hanldeNodeSelect(node)">
            <span class="label">{{ getLabel(node) }}</span>
            <eui-dropdown *ngIf="isEditMode()">
              <button
                euiButton
                euiRounded
                euiIconButton
                euiBasicButton
                euiSecondary
                [euiTooltip]="
                  tranlsateService.instant(
                    'page.editor.toc.tree-node.more-options'
                  )
                "
                [attr.aria-label]="
                  tranlsateService.instant(
                    'page.editor.toc.tree-node.more-options'
                  )
                "
              >
                <span
                  euiIcon
                  iconClass="eui-icon eui-icon-more-vertical"
                ></span>
              </button>
              <eui-dropdown-content>
                <div euiList>
                  <button
                    euiListItem
                    (click)="handleMove(node)"
                    *ngIf="!isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.move' | translate }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'BEFORE')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{
                      'page.editor.toc.move-actions.place-before' | translate
                    }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'AS_CHILDREN')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.place-child' | translate }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'AFTER')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.place-after' | translate }}
                  </button>
                </div>
              </eui-dropdown-content>
            </eui-dropdown>
          </div>
        </li>
      </mat-nested-tree-node>
      <mat-nested-tree-node
        cdkScrollable
        [hidden]="!node.tocItem.display"
        *matTreeNodeDef="let node; when: hasChildren"
        cdkDrag
        cdkDropList
        matTreeNodePadding
        [attr.data-id]="node.id"
        [cdkDragData]="node"
        (cdkDragMoved)="dragMoved($event)"
        (cdkDropListDropped)="onDrop($event)"
        [cdkDropListSortingDisabled]="true"
        [cdkDropListDisabled]="!isEditMode()"
      >
        <li class="">
          <div class="mat-tree-node mr-2" (click)="hanldeNodeSelect(node)">
            <eui-icon
              euiSizeM
              matTreeNodeToggle
              *ngIf="!treeControl.isExpanded(node)"
              iconClass="eui-icon-angle-right"
              (click)="saveExpanded(node)"
            ></eui-icon>
            <eui-icon
              matTreeNodeToggle
              *ngIf="treeControl.isExpanded(node)"
              iconClass="eui-icon eui-icon-angle-down"
              (click)="saveExpanded(node)"
            ></eui-icon>
            <span class="label-extended" (click)="hanldeNodeSelect(node)">{{
              getLabel(node)
            }}</span>
            <eui-dropdown *ngIf="isEditMode()">
              <button
                euiButton
                euiRounded
                euiIconButton
                euiBasicButton
                euiSecondary
                [euiTooltip]="
                  tranlsateService.instant(
                    'page.editor.toc.tree-node.more-options'
                  )
                "
                [attr.aria-label]="
                  tranlsateService.instant(
                    'page.editor.toc.tree-node.more-options'
                  )
                "
              >
                <span
                  euiIcon
                  iconClass="eui-icon eui-icon-more-vertical"
                ></span>
              </button>
              <eui-dropdown-content>
                <div euiList>
                  <button
                    euiListItem
                    (click)="handleMove(node)"
                    *ngIf="!isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.move' | translate }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'BEFORE')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{
                      'page.editor.toc.move-actions.place-before' | translate
                    }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'AS_CHILDREN')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.place-child' | translate }}
                  </button>
                  <button
                    euiListItem
                    (click)="handlePlaceAt(node, 'AFTER')"
                    *ngIf="isNodeSelectedToMove()"
                  >
                    {{ 'page.editor.toc.move-actions.place-after' | translate }}
                  </button>
                </div>
              </eui-dropdown-content>
            </eui-dropdown>
          </div>
          <ul class="">
            <div *ngIf="treeControl.isExpanded(node)">
              <ng-container matTreeNodeOutlet></ng-container>
            </div>
          </ul>
        </li>
      </mat-nested-tree-node>
    </mat-tree>
  </div>
  <!-- validation message -->
  <div class="d-flex flex-column p-2 eui-u-font-l w-100">
    <span
      euiLabel
      [euiDanger]="!isDropValid"
      [euiSuccess]="isDropValid"
      euiSize2XL
      [innerHTML]="messageFromValidation"
    >
    </span>
  </div>
  <!-- selected element show -->
  <div class="d-flex flex-column" *ngIf="isEditMode() && isNodeSelected()">
    <eui-card>
      <eui-card-header>
        <eui-card-header-title>
          <h4>
            {{ 'page.editor.toc.selected-element.title' | translate }}
          </h4>
        </eui-card-header-title>
      </eui-card-header>
      <eui-card-content>
        <div class="d-flex flex-column">
          <div class="d-flex flex-row">
            <div class="m-2">
              <label euiLabel class="font-weight-bold" for="">{{
                'page.editor.toc.selected-element.type' | translate
              }}</label
              ><input euiInputText disabled type="text" [(ngModel)]="type" />
            </div>
            <div
              class="m-2"
              [hidden]="!isItemNumberVisible(this.selectedNode.tocItem)"
            >
              <label class="font-weight-bold" euiLabel for="">{{
                'page.editor.toc.selected-element.number' | translate
              }}</label
              ><input
                euiInputText
                type="text"
                [disabled]="!isItemNumberEditable(this.selectedNode.tocItem)"
                [(ngModel)]="number"
              />
            </div>
          </div>
          <div
            class=""
            [hidden]="!isItemHeadingVisible(this.selectedNode.tocItem)"
          >
            <label euiLabel class="font-weight-bold" for="">{{
              'page.editor.toc.selected-element.heading' | translate
            }}</label>
            <input
              euiInputText
              type="text"
              [(ngModel)]="heading"
              [disabled]="!isItemHeadingEditable(this.selectedNode.tocItem)"
              (ngModelChange)="handleHeadingChange($event)"
            />
          </div>
          <!-- TODO : this will be done with ec/cn differences for screen 3 -->
          <!-- <div
            class="d-flex flex-row mt-4 justify-content-evenly"
            *ngIf="isArticle(selectedNode.tocItem)"
          >
            <h5 class="mr-3">Type</h5>
            <div class="d-flex flex-row align-items-center">
              <label>Regular</label>
              <input
                euiInputRadio
                value="regular"
                [(ngModel)]="tocType"
                (ngModelChange)="handleTypeChange($event)"
              />
            </div>
            <div class="d-flex flex-row align-items-center">
              <label>Definition</label>
              <input
                euiInputRadio
                value="definition"
                [(ngModel)]="tocType"
                (ngModelChange)="handleTypeChange($event)"
              />
            </div>
          </div> -->
          <div class="mt-2 align-self-end">
            <button
              euiButton
              class="w-25"
              euiDanger
              (click)="hanldeTocRemove()"
              [disabled]="!selectedNode.tocItem.deletable"
            >
              {{ 'page.editor.toc.selected-element.delete' | translate }}
            </button>
          </div>
        </div>
      </eui-card-content>
    </eui-card>
  </div>
</div>
