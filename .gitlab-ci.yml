stages:
  - build
  - test
  - deploy

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -DskipTests=true'
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn/cache"
  GIT_CLEAN_FLAGS: -ffdx -e .yarn -e .m2/repository -e .npm
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  CYPRESS_CACHE_FOLDER: '$CI_PROJECT_DIR/cache/Cypress'

java-build:
  image: code.europa.eu:4567/leos/core/image-for-tests:1.0.2
  stage: build
  script:
    - cd $CI_PROJECT_DIR/tools/user-repo
    - mvn clean install
    - cd $CI_PROJECT_DIR/tools/repository
    - mvn clean install
    - cd $CI_PROJECT_DIR
    - mvn clean install
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - pom.xml
      - "**/target"
      - "**/package-lock.json"
      - "**/yarn.lock"
  cache:
    paths:
      - $CI_PROJECT_DIR/.m2
      - $CI_PROJECT_DIR/.yarn
      - $CI_PROJECT_DIR/.npm
    policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

cypress-test-for-local:
  image:
    name: code.europa.eu:4567/leos/core/image-for-tests:1.0.2
  variables:
    TAGS_TO_RUN: "@local"
    GIT_CLEAN_FLAGS: none
  stage: test
  resource_group: cypress
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $TAGS_TO_RUN == "@local"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
  script:
    - cd $CI_PROJECT_DIR/tools/user-repo/web
    - mvn spring-boot:run -Dspring-boot.run.profiles=h2 &
    - cd $CI_PROJECT_DIR/tools/repository/web
    - mvn spring-boot:run -Dspring-boot.run.directories=../config/target/generated-config &
    - cd $CI_PROJECT_DIR/modules/web
    - mvn jetty:run-war &
    - sleep 40
    - cd $CI_PROJECT_DIR/modules/test-cypress
    - npm install
    - npx cypress run --browser chrome --headed -e CE_ENV="$TAGS_TO_RUN",TAGS="$TAGS_TO_RUN"
  after_script:
    - cd $CI_PROJECT_DIR/modules/test-cypress
    - node ./cucumberReport.js
  artifacts:
    expire_in: 5 days
    when: always
    paths:
      - $CI_PROJECT_DIR/modules/test-cypress/cypress/screenshots/**/*.png
      - $CI_PROJECT_DIR/modules/test-cypress/cypress/report/**/*.*

cypress-test-for-non-local:
  image:
    name: code.europa.eu:4567/leos/core/image-for-tests:1.0.2
  stage: test
  resource_group: cypress
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TAGS_TO_RUN == "@nonlocal"
  script:
    - cd $CI_PROJECT_DIR/modules/test-cypress
    - npm install
    - npx cypress run --browser chrome --headed -e CE_ENV="$TAGS_TO_RUN",TAGS="$TAGS_TO_RUN"
  after_script:
    - cd $CI_PROJECT_DIR/modules/test-cypress
    - node ./cucumberReport.js
  artifacts:
    expire_in: 5 days
    when: always
    paths:
      - $CI_PROJECT_DIR/modules/test-cypress/cypress/screenshots/**/*.png
      - $CI_PROJECT_DIR/modules/test-cypress/cypress/report/**/*.*

include:
  - project: 'digit.s.1/sa/security-scan-template'
    file: '.gitlab-ci-security-scan.yml'
    ref: main

fortify-sast:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: "$CI_COMMIT_MESSAGE =~ /.*\\[(sec skip|skip sec)\\].*/"
      when: never
    - if: "$CI_COMMIT_MESSAGE =~ /.*\\[(sec run|run sec)\\].*/"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE !~ /^Draft.*$/
      when: never

