variables:
  CI_DEBUG_TRACE: "true"
  DS_JAVA_VERSION: 8

stages:
  - build

java-build:
  image: maven:3.8-openjdk-8
  stage: build
  script:
    - mvn clean package -DskipTests=true -Dmaven.repo.local=./.m2/repository
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - "modules/web/target/"