coverpage.disclaimer.europa=Níor glactar leis an dréacht seo ná níor thug Comisiún na hEorpa a thacaíocht dó. Is tuairimí réamhshamhlacha iad aon tuairimí a nochtar ó sheirbhísí an Choimisinúin, agus ní féidir i gcíorcalacha ar bith iad a lorg mar sheasamh oifigiúil an Choimisinúin.
coverpage.disclaimer.expert=Níor glactar leis an dréacht seo ná níor thug Comisiún na hEorpa a thacaíocht dó. Is tuairimí réamhshamhlacha iad aon tuairimí a nochtar ó sheirbhísí an Choimisinúin, agus ní féidir i gcíorcalacha ar bith iad a lorg mar sheasamh oifigiúil an Choimisinúin. Tá an t-eolas a aistríodh dírithe ar an mBallstát nó ar an eintitas ar leith a bhfuil sé seolta chuici/chuige chun plé a dhéanamh, agus d?fhéadfadh sé ábhar faoi rún agus/nó príobháideach a bheith ann. 
