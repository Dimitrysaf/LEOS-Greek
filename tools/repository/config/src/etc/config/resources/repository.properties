spring.profiles.active=@repository.db@
spring.main.banner-mode=off

server.servlet.context-path=/repository
# This port is used only when running as boot application
server.port=9097

repository.template.path=@repository.template.path@
repository.template.custom.path=@repository.template.custom.path@
repository.template.custom.version=@repository.template.custom.version@
repository.workspace.path=@repository.workspace.path@
repository.data.script.path=@repository.data.script.path@

logging.file=repository.log

repository.jwt.auth.enabled=@repository.jwt.auth.enabled@
repository.jwt.auth.issuer.id=@repository.jwt.auth.issuer.id@
repository.jwt.auth.access.token.expiration.min=@repository.jwt.auth.access.token.expiration.min@

repository.jwt.auth.user.details.cache.expiration.min=@repository.jwt.auth.user.details.cache.expiration.min@
repository.jwt.auth.user.details.url=@repository.jwt.auth.user.details.url@

repository.jwt.auth.clients=@repository.jwt.auth.clients@
repository.jwt.auth.client.leos.id=@repository.jwt.auth.client.leos.id@

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.health.diskspace.enabled=false
management.health.ssl.enabled=false

# Master Health Check - URLs for dependent apps
leos.health.master.enabled=@leos.health.master.enabled@
leos.health.akn4euutil.url=@leos.health.akn4euutil.url@
leos.health.user-repo.url=@leos.health.user-repo.url@