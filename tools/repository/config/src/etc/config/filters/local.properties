repository.db=h2

repository.jwt.auth.enabled=false
repository.jwt.auth.issuer.id=repository
repository.jwt.auth.access.token.expiration.min=600

repository.jwt.auth.user.details.cache.expiration.min=60
repository.jwt.auth.user.details.url=http://localhost:9095/ud-repo/users/{userId}

repository.jwt.auth.clients=leos
repository.jwt.auth.client.leos.id=leosClientId

repository.template.path=leos/templates
repository.workspace.path=leos/workspaces/package_1
repository.data.script.path=data-property-h2.sql

repository.jwt.auth.issuer.secret=repositorySecret
repository.jwt.auth.client.leos.secret=leosSecret