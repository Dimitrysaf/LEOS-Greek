bl.article2.decision=Ez a határozat az <i>Európai Unió Hivatalos Lapjában</i> való kihirdetését követő [...] napon lép hatályba.
bl.firstParagraphOfArticle2.directive=A tagállamok hatályba léptetik azokat a törvényi, rendeleti és közigazgatási rendelkezéseket, amelyek szükségesek ahhoz, hogy ennek az irányelvnek legkésobb [...]-ig megfeleljenek. E rendelkezések szövegét haladéktalanul megküldik a Bizottság számára.
bl.secondParagraphOfArticle2.directive=Amikor a tagállamok elfogadják ezeket a rendelkezéseket, azokban hivatkozni kell erre az irányelvre, vagy azokhoz hivatalos kihirdetésük alkalmával ilyen hivatkozást kell fuzni. A hivatkozás módját a tagállamok határozzák meg.
bl.thirdParagraphOfArticle2.directive=A tagállamok közlik a Bizottsággal nemzeti joguk azon fobb rendelkezéseinek szövegét, amelyeket az ezen irányelv által szabályozott területen fogadnak el.
bl.firstParagraphOfArticle2Alternative.directive=A tagállamok legkésobb [...]-ig elfogadják és kihirdetik azokat a törvényi, rendeleti és közigazgatási rendelkezéseket, amelyek szükségesek ahhoz, hogy ennek az irányelvnek megfeleljenek. E rendelkezések szövegét haladéktalanul megküldik a Bizottság számára.
bl.secondParagraphOfArticle2Alternative.directive=Ezeket a rendelkezéseket [...]-tól/-tol alkalmazzák.

