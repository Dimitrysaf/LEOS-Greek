bl.firstParagraphOfArticle2.007=A tagállamok hatályba léptetik azokat a törvényi, rendeleti és közigazgatási rendelkezéseket, amelyek szükségesek ahhoz, hogy ennek az irányelvnek legkésobb [...]-ig megfeleljenek. E rendelkezések szövegét haladéktalanul megküldik a Bizottság számára.
bl.secondParagraphOfArticle2.007=Amikor a tagállamok elfogadják ezeket a rendelkezéseket, azokban hivatkozni kell erre az irányelvre, vagy azokhoz hivatalos kihirdetésük alkalmával ilyen hivatkozást kell fuzni. A hivatkozás módját a tagállamok határozzák meg.
bl.thirdParagraphOfArticle2.007=A tagállamok közlik a Bizottsággal nemzeti joguk azon fobb rendelkezéseinek szövegét, amelyeket az ezen irányelv által szabályozott területen fogadnak el.
bl.firstParagraphOfArticle2Alternative.007=A tagállamok legkésobb [...]-ig elfogadják és kihirdetik azokat a törvényi, rendeleti és közigazgatási rendelkezéseket, amelyek szükségesek ahhoz, hogy ennek az irányelvnek megfeleljenek. E rendelkezések szövegét haladéktalanul megküldik a Bizottság számára.
bl.secondParagraphOfArticle2Alternative.007=Ezeket a rendelkezéseket [...]-tól/-tol alkalmazzák.
