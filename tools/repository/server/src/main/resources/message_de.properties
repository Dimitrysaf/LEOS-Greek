bl.firstParagraphOfArticle2.007=Die Mitgliedstaaten erlassen die erforderlichen Rechts- und Verwaltungsvorschriften, um dieser Richtlinie spätestens am [...] nachzukommen. Sie teilen der Kommission unverzüglich den Wortlaut dieser Vorschriften mit.
bl.secondParagraphOfArticle2.007=Bei Erlass dieser Vorschriften nehmen die Mitgliedstaaten in den Vorschriften selbst oder durch einen Hinweis bei der amtlichen Veröffentlichung auf diese Richtlinie Bezug. Die Mitgliedstaaten regeln die Einzelheiten dieser Bezugnahme.
bl.thirdParagraphOfArticle2.007=Die Mitgliedstaaten teilen der Kommission den Wortlaut der wichtigsten nationalen Vorschriften mit, die sie auf dem unter diese Richtlinie fallenden Gebiet erlassen.
bl.firstParagraphOfArticle2Alternative.007=Die Mitgliedstaaten erlassen und veröffentlichen spätestens am [...] die erforderlichen Rechts- und Verwaltungsvorschriften, um dieser Richtlinie nachzukommen. Sie teilen der Kommission unverzüglich den Wortlaut dieser Vorschriften mit.
bl.secondParagraphOfArticle2Alternative.007=Sie wenden diese Vorschriften ab dem [...] an.
