# For SJ-007
bl.enactingFormula.007=PRIJALA TÚTO SMERNICU:
bl.firstParagraphOfArticle2.007=Clenské štáty uvedú do úcinnosti zákony, iné právne predpisy a správne opatrenia potrebné na dosiahnutie súladu s touto smernicou najneskôr do [...]. Komisii bezodkladne oznámia znenie týchto ustanovení.
bl.secondParagraphOfArticle2.007=Clenské štáty uvedú priamo v prijatých ustanoveniach alebo pri ich úradnom uverejnení odkaz na túto smernicu. Podrobnosti o odkaze upravia clenské štáty.
bl.thirdParagraphOfArticle2.007=Clenské štáty oznámia Komisii znenie hlavných ustanovení vnútroštátnych právnych predpisov, ktoré prijmú v oblasti pôsobnosti tejto smernice.
bl.firstParagraphOfArticle2Alternative.007=Clenské štáty prijmú a uverejnia najneskôr do [...] zákony, iné právne predpisy a správne opatrenia potrebné na dosiahnutie súladu s touto smernicou. Komisii bezodkladne oznámia znenie týchto ustanovení.
bl.secondParagraphOfArticle2Alternative.007=Tieto ustanovenia uplatnujú od [...].
bl.article3.007=Táto smernica nadobúda úcinnost [...] dnom po jej uverejnení v <i>Úradnom vestníku Európskej únie</i>.
bl.article4.007=Táto smernica je urcená clenským štátom.

