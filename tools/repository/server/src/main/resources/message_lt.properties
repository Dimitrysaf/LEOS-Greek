bl.enactingFormula.007=DONIJELA JE OVU DIREKTIVU:
bl.firstParagraphOfArticle2.007=Države članice stavljaju na snagu zakone i druge propise koji su potrebni radi usklađivanja s ovom Direktivom najkasnije do [...]. One Komisiji odmah dostavljaju tekst tih odredaba.
bl.secondParagraphOfArticle2.007=Kada države članice donose te odredbe, one sadržavaju upućivanje na ovu Direktivu ili se na nju upućuje prilikom njihove službene objave. Države članice određuju načine tog upućivanja.
bl.thirdParagraphOfArticle2.007=Države članice Komisiji dostavljaju tekst glavnih odredaba nacionalnog prava koje donesu u području na koje se odnosi ova Direktiva.
bl.firstParagraphOfArticle2Alternative.007=Valstybės narės ne vėliau kaip [...] priima ir paskelbia įstatymus ir kitus teisės aktus, būtinus, kad būtų laikomasi šios direktyvos. Jos nedelsdamos pateikia Komisijai tų teisės aktų nuostatų tekstą.
bl.secondParagraphOfArticle2Alternative.007=Tas nuostatas jos taiko nuo [...].
bl.article3.007=Ova Direktiva stupa na snagu [...] dana od dana objave u <i>Službenom listu Europske unije</i>.
bl.article4.007=Ova je Direktiva upućena državama članicama.
