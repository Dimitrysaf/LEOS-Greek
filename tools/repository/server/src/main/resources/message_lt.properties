bl.article2.decision=Šis sprendimas įsigalioja [...] dieną po jo paskelbimo <i>Europos Sąjungos oficialiajame leidinyje</i>.
bl.firstParagraphOfArticle2.directive=Valstybės narės užtikrina, kad įsigaliotų įstatymai ir kiti teisės aktai, būtini, kad šios direktyvos būtų laikomasi ne vėliau kaip nuo [...]. Jos nedelsdamos pateikia Komisijai tų teisės aktų nuostatų tekstą.
bl.secondParagraphOfArticle2.directive=Valstybės narės, priimdamos tas nuostatas, daro jose nuorodą į šią direktyvą arba tokia nuoroda daroma jas oficialiai skelbiant. Nuorodos darymo tvarką nustato valstybės narės.
bl.thirdParagraphOfArticle2.directive=Valstybės narės pateikia Komisijai šios direktyvos taikymo srityje priimtų nacionalinės teisės aktų pagrindinių nuostatų tekstus.
bl.firstParagraphOfArticle2Alternative.directive=Valstybės narės ne vėliau kaip [...] priima ir paskelbia įstatymus ir kitus teisės aktus, būtinus, kad būtų laikomasi šios direktyvos. Jos nedelsdamos pateikia Komisijai tų teisės aktų nuostatų tekstą.
