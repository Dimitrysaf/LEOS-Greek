# For SJ-007
bl.enactingFormula.007=ΕΞΕΔΩΣΕ ΤΗΝ ΠΑΡΟΥΣΑ ΟΔΗΓΙΑ:
bl.firstParagraphOfArticle2.007=Τα κράτη μέλη θέτουν σε ισχύ τις αναγκαίες νομοθετικές, κανονιστικές και διοικητικές διατάξεις για να συμμορφωθούν προς την παρούσα οδηγία το αργότερο την/στις [...]. Ανακοινώνουν αμέσως στην Επιτροπή το κείμενο των εν λόγω διατάξεων.
bl.secondParagraphOfArticle2.007=Όταν τα κράτη μέλη θεσπίζουν τις εν λόγω διατάξεις, αυτές περιέχουν αναφορά στην παρούσα οδηγία ή συνοδεύονται από την αναφορά αυτή κατά την επίσημη δημοσίευσή τους. Ο τρόπος της αναφοράς αποφασίζεται από τα κράτη μέλη.
bl.thirdParagraphOfArticle2.007=Τα κράτη μέλη ανακοινώνουν στην Επιτροπή το κείμενο των ουσιωδών διατάξεων εσωτερικού δικαίου τις οποίες θεσπίζουν στον τομέα που διέπεται από την παρούσα οδηγία.
bl.firstParagraphOfArticle2Alternative.007=Τα κράτη μέλη θεσπίζουν και δημοσιεύουν, το αργότερο την/στις [...], τις αναγκαίες νομοθετικές, κανονιστικές και διοικητικές διατάξεις για να συμμορφωθούν προς την παρούσα οδηγία. Ανακοινώνουν αμέσως στην Επιτροπή το κείμενο των εν λόγω διατάξεων.
bl.secondParagraphOfArticle2Alternative.007=Εφαρμόζουν τις διατάξεις αυτές από [...].
bl.article3.007=Η παρούσα οδηγία αρχίζει να ισχύει την [...] ημέρα από τη δημοσίευσή της στην <i>Επίσημη Εφημερίδα της Ευρωπαϊκής Ένωσης</i>.
bl.article4.007=Η παρούσα οδηγία απευθύνεται στα κράτη μέλη.
