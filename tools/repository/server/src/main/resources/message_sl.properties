bl.enactingFormula.007=SPREJELA NASLEDNJO DIREKTIVO:
bl.firstParagraphOfArticle2.007=Države članice uveljavijo zakone in druge predpise, potrebne za uskladitev s to direktivo, najpozneje do [...]. Komisiji takoj sporočijo besedilo teh predpisov.
bl.secondParagraphOfArticle2.007=Države članice se v sprejetih predpisih sklicujejo na to direktivo ali pa sklic nanjo navedejo ob njihovi uradni objavi. Način sklicevanja določijo države članice.
bl.thirdParagraphOfArticle2.007=Države članice Komisiji sporočijo besedilo temeljnih predpisov nacionalnega prava, sprejetih na področju, ki ga ureja ta direktiva.
bl.firstParagraphOfArticle2Alternative.007=Države članice sprejmejo in objavijo zakone in druge predpise, potrebne za uskladitev s to direktivo, najpozneje do [...]. Komisiji takoj sporočijo besedilo teh predpisov.
bl.secondParagraphOfArticle2Alternative.007=Države članice te predpise uporabljajo od [...].
bl.article3.007=Ta direktiva začne veljati [...] dan po objavi v <i>Uradnem listu Evropske unije</i>.
