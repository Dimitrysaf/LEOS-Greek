# For SJ-007
bl.enactingFormula.007=HA ADOPTADO LA PRESENTE DIRECTIVA:
bl.firstParagraphOfArticle2.007=Los Estados miembros pondrán en vigor a más tardar el [...] las disposiciones legales, reglamentarias y administrativas necesarias para dar cumplimiento a lo establecido en la presente Directiva. Comunicarán inmediatamente a la Comisión el texto de dichas disposiciones.
bl.secondParagraphOfArticle2.007=Cuando los Estados miembros adopten dichas disposiciones, estas incluirán una referencia a la presente Directiva o irán acompañadas de dicha referencia en su publicación oficial. Los Estados miembros establecerán las modalidades de la mencionada referencia.
bl.thirdParagraphOfArticle2.007=Los Estados miembros comunicarán a la Comisión el texto de las principales disposiciones de Derecho interno que adopten en el ámbito regulado por la presente Directiva.
bl.firstParagraphOfArticle2Alternative.007=Los Estados miembros adoptarán y publicarán a más tardar el [...] las disposiciones legales, reglamentarias y administrativas necesarias para dar cumplimiento a lo establecido en la presente Directiva. Comunicarán inmediatamente a la Comisión el texto de dichas disposiciones.
bl.secondParagraphOfArticle2Alternative.007=Aplicarán dichas disposiciones a partir del [...].
bl.article3.007=La presente Directiva entrará en vigor a los [...] días de su publicación en el <i>Diario Oficial de la Unión Europea</i>.
bl.article4.007=Los destinatarios de la presente Directiva son los Estados miembros.
