# For SJ-007
bl.firstParagraphOfArticle2.007=Dalībvalstīs stājas spēkā normatīvie un administratīvie akti, kas vajadzīgi, lai izpildītu šīs direktīvas prasības vēlākais līdz [...]. Dalībvalstis tūlīt dara Komisijai zināmus minēto noteikumu tekstus.
bl.secondParagraphOfArticle2.007=Kad dalībvalstis pieņem minētos noteikumus, tajos ietver atsauci uz šo direktīvu vai šādu atsauci pievieno to oficiālai publikācijai. Dalībvalstis nosaka, kā izdarāma šāda atsauce.
bl.thirdParagraphOfArticle2.007=Dalībvalstis dara Komisijai zināmus to tiesību aktu galvenos noteikumus, ko tās pieņem jomā, uz kuru attiecas šī direktīva.
bl.firstParagraphOfArticle2Alternative.007=Dalībvalstis vēlākais līdz [...] pieņem un publicē normatīvos un administratīvos aktus, kas vajadzīgi, lai izpildītu šīs direktīvas prasības. Dalībvalstis tūlīt dara zināmus Komisijai minēto noteikumu tekstus.
bl.secondParagraphOfArticle2Alternative.007=Tās piemēro minētos noteikumus no [...].
