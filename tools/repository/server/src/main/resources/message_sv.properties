bl.firstParagraphOfArticle2.directive=Medlemsstaterna ska senast den [...] sätta i kraft de lagar och andra författningar som är nödvändiga för att följa detta direktiv. De ska till kommissionen genast överlämna texten till dessa bestämmelser.
bl.secondParagraphOfArticle2.directive=När en medlemsstat antar dessa bestämmelser ska de innehålla en hänvisning till detta direktiv eller åtföljas av en sådan hänvisning när de offentliggörs. Närmare föreskrifter om hur hänvisningen ska göras ska varje medlemsstat själv utfärda.
bl.thirdParagraphOfArticle2.directive=Medlemsstaterna ska till kommissionen överlämna texten till de centrala bestämmelser i nationell lagstiftning som de antar inom det område som omfattas av detta direktiv.
bl.firstParagraphOfArticle2Alternative.directive=Medlemsstaterna ska senast den [...] anta och offentliggöra de lagar och andra författningar som är nödvändiga för att följa detta direktiv. De ska till kommissionen genast överlämna texten till dessa bestämmelser.
bl.secondParagraphOfArticle2Alternative.directive=De ska tillämpa dessa bestämmelser från och med den [...].

