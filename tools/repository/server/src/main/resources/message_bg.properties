bl.firstParagraphOfArticle2.directive=Държавите членки въвеждат в сила законовите, подзаконовите и административните разпоредби, необходими, за да се съобразят с настоящата директива, най-късно до [...] г. Те незабавно съобщават на Комисията текста на тези разпоредби.
bl.secondParagraphOfArticle2.directive=Когато държавите членки приемат тези разпоредби, в тях се съдържа позоваване на настоящата директива или то се извършва при официалното им публикуване. Условията и редът на позоваване се определят от държавите членки.
bl.thirdParagraphOfArticle2.directive=Държавите членки съобщават на Комисията текста на основните разпоредби от националното законодателство, които те приемат в областта, уредена с настоящата директива.
bl.firstParagraphOfArticle2Alternative.directive=Държавите членки приемат и публикуват не по-късно от [...] г. законовите, подзаконовите и административните разпоредби, необходими, за да се съобразят с настоящата директива. Те незабавно съобщават на Комисията текста на тези разпоредби.
