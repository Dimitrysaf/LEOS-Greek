# For SJ-007
bl.enactingFormula.007=ON HYVÄKSYNYT TÄMÄN DIREKTIIVIN:
bl.firstParagraphOfArticle2.007=Jäsenvaltioiden on saatettava tämän direktiivin noudattamisen edellyttämät lait, asetukset ja hallinnolliset määräykset voimaan viimeistään [...] päivänä [...]kuuta [...]. Niiden on viipymättä toimitettava komissiolle kirjallisina nämä säännökset.
bl.secondParagraphOfArticle2.007=Näissä jäsenvaltioiden antamissa säädöksissä on viitattava tähän direktiiviin tai niihin on liitettävä tällainen viittaus, kun ne virallisesti julkaistaan. Jäsenvaltioiden on säädettävä siitä, miten viittaukset tehdään.
bl.thirdParagraphOfArticle2.007=Jäsenvaltioiden on toimitettava tässä direktiivissä tarkoitetuista kysymyksistä antamansa keskeiset kansalliset säännökset kirjallisina komissiolle.
bl.firstParagraphOfArticle2Alternative.007=Jäsenvaltioiden on annettava ja julkaistava tämän direktiivin noudattamisen edellyttämät lait, asetukset ja hallinnolliset määräykset viimeistään [...] päivänä [...]kuuta [...]. Niiden on viipymättä toimitettava komissiolle kirjallisina nämä säännökset.
bl.secondParagraphOfArticle2Alternative.007=Jäsenvaltioiden on sovellettava näitä säännöksiä [...] päivästä [...]kuuta [...].
bl.article3.007=Tämä direktiivi tulee voimaan [...] päivänä sen jälkeen, kun se on julkaistu <i>Euroopan unionin virallisessa lehdessä</i>.
bl.article4.007=Tämä direktiivi on osoitettu kaikille jäsenvaltioille.
