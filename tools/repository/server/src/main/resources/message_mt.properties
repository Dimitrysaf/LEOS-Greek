# For SJ-007
bl.firstParagraphOfArticle2.007=L-Istati Membri għandhom idaħħlu fis-seħħ il-liġijiet, ir-regolamenti u d-dispożizzjonijiet amministrattivi neċessarji sabiex jikkonformaw ma' din id-Direttiva sa mhux iktar tard mi[nn] [...]. Huma għandhom jikkomunikaw minnufih it-test ta' dawk id-dispożizzjonijiet lill-Kummissjoni.
bl.secondParagraphOfArticle2.007=Meta l-Istati Membri jadottaw dawk id-dispożizzjonijiet, fihom għandu jkun hemm referenza għal din id-Direttiva jew għandhom ikunu akkumpanjati minn dik ir-referenza meta ssir il-pubblikazzjoni uffiċjali tagħhom. Huma l-Istati Membri li għandhom jiddeċiedu kif issir dik ir-referenza.
bl.thirdParagraphOfArticle2.007=L-Istati Membri għandhom jikkomunikaw lill-Kummissjoni t-test tad-dispożizzjonijiet ewlenin tad-dritt nazzjonali li huma jadottaw fil-qasam kopert minn din id-Direttiva.
bl.firstParagraphOfArticle2Alternative.007=L-Istati Membri għandhom jadottaw u jippubblikaw, sa mhux iktar tard mi[nn] [...] il-liġijiet, ir-regolamenti u d-dispożizzjonijiet amministrattivi neċessarji sabiex jikkonformaw ma' din id-Direttiva. Huma għandhom jikkomunikaw minnufih it-test ta' dawk id-dispożizzjonijiet lill-Kummissjoni.
bl.secondParagraphOfArticle2Alternative.007=Huma għandhom japplikaw dawk id-dispożizzjonijiet mi[nn] [...].
bl.article3.007=Din id-Direttiva għandha tidħol fis-seħħ fi [...] jum wara dak tal-pubblikazzjoni tagħha f'<i>Il-Ġurnal Uffiċjali tal-Unjoni Ewropea</i>.
bl.article4.007=Din id-Direttiva hija indirizzata lill-Istati Membri.

