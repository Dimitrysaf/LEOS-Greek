bl.article2.regulation=Dan ir-Regolament għandu jidħol fis-seħħ fi [...] jum wara dak tal-pubblikazzjoni tiegħu f’<i>Il-Ġurnal Uffiċjali tal-Unjoni Ewropea</i>.
bl.clause.regulation=Dan ir-Regolament għandu jorbot fl-intier tiegħu u japplika direttament fl-Istati Membri kollha.
bl.clauseAlternative.regulation=Dan ir-Regolament għandu jorbot fl-intier tiegħu u japplika direttament fl-Istati Membri f’konformità mat-Trattati.
bl.article3.directive=Din id-Direttiva għandha tidħol fis-seħħ fi [...] jum wara dak tal-pubblikazzjoni tagħha f'<i>Il-Ġurnal Uffiċjali tal-Unjoni Ewropea</i>.
bl.article4.directive=Din id-Direttiva hija indirizzata lill-Istati Membri.
bl.article2.decision=Din id-Deċiżjoni għandha tidħol fis-seħħ fi [...] jum wara dak tal-pubblikazzjoni tagħha f’ <i>Il-Ġurnal Uffiċjali tal-Unjoni Ewropea</i>.
bl.firstParagraphOfArticle2.directive=L-Istati Membri għandhom idaħħlu fis-seħħ il-liġijiet, ir-regolamenti u d-dispożizzjonijiet amministrattivi neċessarji sabiex jikkonformaw ma' din id-Direttiva sa mhux iktar tard mi[nn] [...]. Huma għandhom jikkomunikaw minnufih it-test ta' dawk id-dispożizzjonijiet lill-Kummissjoni.
bl.secondParagraphOfArticle2.directive=Meta l-Istati Membri jadottaw dawk id-dispożizzjonijiet, fihom għandu jkun hemm referenza għal din id-Direttiva jew għandhom ikunu akkumpanjati minn dik ir-referenza meta ssir il-pubblikazzjoni uffiċjali tagħhom. Huma l-Istati Membri li għandhom jiddeċiedu kif issir dik ir-referenza.
bl.thirdParagraphOfArticle2.directive=L-Istati Membri għandhom jikkomunikaw lill-Kummissjoni t-test tad-dispożizzjonijiet ewlenin tad-dritt nazzjonali li huma jadottaw fil-qasam kopert minn din id-Direttiva.
bl.firstParagraphOfArticle2Alternative.directive=L-Istati Membri għandhom jadottaw u jippubblikaw, sa mhux iktar tard mi[nn] [...] il-liġijiet, ir-regolamenti u d-dispożizzjonijiet amministrattivi neċessarji sabiex jikkonformaw ma' din id-Direttiva. Huma għandhom jikkomunikaw minnufih it-test ta' dawk id-dispożizzjonijiet lill-Kummissjoni.
bl.secondParagraphOfArticle2Alternative.directive=Huma għandhom japplikaw dawk id-dispożizzjonijiet mi[nn] [...].

