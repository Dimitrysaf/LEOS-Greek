# For SJ-007
bl.enactingFormula.007=ON VASTU VTNUD KESOLEVA DIREKTIIVI:
bl.firstParagraphOfArticle2.007=Liikmesriigid justavad kesoleva direktiivi jrgimiseks vajalikud igus- ja haldusnormid hiljemalt [...] (kuupev saavas kndes). Nad edastavad knealuste normide teksti viivitamata komisjonile.
bl.secondParagraphOfArticle2.007=Kui liikmesriigid need normid vastu vtavad, lisavad nad nende ametlikul avaldamisel nendesse vi nende juurde viite kesolevale direktiivile. Sellise viitamise viisi nevad ette liikmesriigid.
bl.thirdParagraphOfArticle2.007=Liikmesriigid edastavad komisjonile kesoleva direktiiviga reguleeritavas valdkonnas vastuvetud philiste siseriiklike igusnormide teksti.
bl.firstParagraphOfArticle2Alternative.007=Liikmesriigid võtavad vastu ja avaldavad käesoleva direktiivi järgimiseks vajalikud õigus- ja haldusnormid hiljemalt [...] (kuupäev saavas käändes). Nad edastavad kõnealuste normide teksti viivitamata komisjonile.
bl.secondParagraphOfArticle2Alternative.007=Liikmesriigid kohaldavad neid norme alates [...] (kuupäev seestütlevas käändes).
bl.article3.007=Kesolev direktiiv justub [...] peval prast selle avaldamist <i>Euroopa Liidu Teatajas</i>.
bl.article4.007=Kesolev direktiiv on adresseeritud liikmesriikidele.
