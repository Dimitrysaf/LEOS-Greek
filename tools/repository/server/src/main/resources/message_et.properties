bl.article.003=Käesolev määrus jõustub [...] päeval pärast selle avaldamist <i>Euroopa Liidu Teatajas</i>.
bl.clause.003=Käesolev määrus on tervikuna siduv ja vahetult kohaldatav kõikides liikmesriikides.
