#For article
bl.article2.regulation=Niniejsze rozporządzenie wchodzi w życie [...] dnia po jego opublikowaniu w <i>Dzienniku Urzędowym Unii Europejskiej</i>.
bl.clause.regulation=Niniejsze rozporządzenie wiąże w całości i jest bezpośrednio stosowane we wszystkich państwach członkowskich.
bl.clauseAlternative.regulation=Niniejsze rozporządzenie wiąże w całości i jest bezpośrednio stosowane w państwach członkowskich zgodnie z Traktatami.
bl.article3.directive=Niniejsza dyrektywa wchodzi w życie [...] dnia po jej opublikowaniu w <i>Dzienniku Urzędowym Unii Europejskiej</i>.
bl.article4.directive=Niniejsza dyrektywa skierowana jest do państw członkowskich.
bl.article2.decision=Niniejsza decyzja wchodzi w życie [...] dnia po jej opublikowaniu w <i>Dzienniku Urzędowym Unii Europejskiej</i>.
bl.firstParagraphOfArticle2.directive=Państwa członkowskie wprowadzają w życie przepisy ustawowe, wykonawcze i administracyjne niezbędne do wykonania niniejszej dyrektywy najpóźniej do dnia [...] r. Niezwłocznie przekazują Komisji tekst tych przepisów.
bl.secondParagraphOfArticle2.directive=Przepisy przyjęte przez państwa członkowskie zawierają odniesienie do niniejszej dyrektywy lub odniesienie takie towarzyszy ich urzędowej publikacji. Metody dokonywania takiego odniesienia określane są przez państwa członkowskie.
bl.thirdParagraphOfArticle2.directive=Państwa członkowskie przekazują Komisji tekst podstawowych przepisów prawa krajowego, przyjętych w dziedzinie objętej niniejszą dyrektywą.
bl.firstParagraphOfArticle2Alternative.directive=Państwa członkowskie przyjmują i publikują, najpóźniej do dnia [...] r., przepisy ustawowe, wykonawcze i administracyjne niezbędne do wykonania niniejszej dyrektywy. Niezwłocznie przekazują Komisji tekst tych przepisów.
bl.secondParagraphOfArticle2Alternative.directive=Państwa członkowskie stosują te przepisy od dnia [...] r.

