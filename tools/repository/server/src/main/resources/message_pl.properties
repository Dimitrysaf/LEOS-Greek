# For SJ-007
bl.enactingFormula.007=PRZYJMUJE NINIEJSZĄ DYREKTYWĘ:
bl.firstParagraphOfArticle2.007=Państwa członkowskie wprowadzają w życie przepisy ustawowe, wykonawcze i administracyjne niezbędne do wykonania niniejszej dyrektywy najpóźniej do dnia [...] r. Niezwłocznie przekazują Komisji tekst tych przepisów.
bl.secondParagraphOfArticle2.007=Przepisy przyjęte przez państwa członkowskie zawierają odniesienie do niniejszej dyrektywy lub odniesienie takie towarzyszy ich urzędowej publikacji. Metody dokonywania takiego odniesienia określane są przez państwa członkowskie.
bl.thirdParagraphOfArticle2.007=Państwa członkowskie przekazują Komisji tekst podstawowych przepisów prawa krajowego, przyjętych w dziedzinie objętej niniejszą dyrektywą.
bl.firstParagraphOfArticle2Alternative.007=Państwa członkowskie przyjmują i publikują, najpóźniej do dnia [...] r., przepisy ustawowe, wykonawcze i administracyjne niezbędne do wykonania niniejszej dyrektywy. Niezwłocznie przekazują Komisji tekst tych przepisów.
bl.secondParagraphOfArticle2Alternative.007=Państwa członkowskie stosują te przepisy od dnia [...] r.
bl.article3.007=Niniejsza dyrektywa wchodzi w życie [...] dnia po jej opublikowaniu w <i>Dzienniku Urzędowym Unii Europejskiej</i>.
bl.article4.007=Niniejsza dyrektywa skierowana jest do państw członkowskich.
