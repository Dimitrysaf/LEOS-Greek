# For SJ-007
bl.enactingFormula.007=HEEFT DE VOLGENDE RICHTLIJN VASTGESTELD:
bl.firstParagraphOfArticle2.007=De lidstaten doen de nodige wettelijke en bestuursrechtelijke bepalingen in werking treden om uiterlijk op [...] aan deze richtlijn te voldoen. Zij delen de Commissie de tekst van die bepalingen onverwijld mede.
bl.secondParagraphOfArticle2.007=Wanneer de lidstaten die bepalingen aannemen, wordt in die bepalingen zelf of bij de officiële bekendmaking ervan naar deze richtlijn verwezen. De regels voor die verwijzing worden vastgesteld door de lidstaten.
bl.thirdParagraphOfArticle2.007=De lidstaten delen de Commissie de tekst van de belangrijkste bepalingen van intern recht mede die zij op het onder deze richtlijn vallende gebied vaststellen.
bl.firstParagraphOfArticle2Alternative.007=De lidstaten dienen uiterlijk op [...] de nodige wettelijke en bestuursrechtelijke bepalingen vast te stellen en bekend te maken om aan deze richtlijn te voldoen. Zij delen de Commissie de tekst van die bepalingen onverwijld mede.
bl.secondParagraphOfArticle2Alternative.007=Zij passen die bepalingen toe vanaf [...].
bl.article3.007=Deze richtlijn treedt in werking op de [...] dag na die van de bekendmaking ervan in het <i>Publicatieblad van de Europese Unie</i>.
bl.article4.007=Deze richtlijn is gericht tot de lidstaten.

