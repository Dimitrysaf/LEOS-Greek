bl.enactingFormula.007=A ADOPTÉ LA PRÉSENTE DIRECTIVE:
bl.firstParagraphOfArticle2.007=Les États membres mettent en vigueur les dispositions législatives, réglementaires et administratives nécessaires pour se conformer à la présente directive au plus tard le [...]. Ils communiquent immédiatement à la Commission le texte de ces dispositions.
bl.secondParagraphOfArticle2.007=Lorsque les États membres adoptent ces dispositions, celles-ci contiennent une référence à la présente directive ou sont accompagnées d'une telle référence lors de leur publication officielle. Les modalités de cette référence sont arrêtées par les États membres.
bl.thirdParagraphOfArticle2.007=Les États membres communiquent à la Commission le texte des dispositions essentielles de droit interne qu'ils adoptent dans le domaine couvert par la présente directive.
