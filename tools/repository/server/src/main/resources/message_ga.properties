#For article
bl.article2.regulation=Tiocfaidh an Rialachán seo i bhfeidhm an [...] lá tar éis lá a fhoilsithe in  <i>Iris Oifigiúil an Aontais Eorpaigh</i>.
bl.clause.regulation=Beidh an Rialachán seo ina cheangal go huile agus go hiomlán agus beidh sé infheidhme go díreach i ngach Ballstát.
bl.clauseAlternative.regulation=Beidh an Rialachán seo ina cheangal go huile agus go hiomlán agus beidh sé infheidhme go díreach sna Ballstáit i gcomhréir leis na Conarthaí.
bl.article3.directive=Tiocfaidh an Treoir seo i bhfeidhm an [...] lá tar éis lá a foilsithe in <i>Iris Oifigiúil an Aontais Eorpaigh</i>.
bl.article4.directive=Is chuig na Ballstáit a dhírítear an Treoir seo.
bl.article2.decision=Tiocfaidh an Cinneadh seo i bhfeidhm an [...] lá tar éis lá a fhoilsithe in <i>Iris Oifigiúil an Aontais Eorpaigh</i>.
bl.firstParagraphOfArticle2.directive=Na forálacha reachtaíochta, rialúcháin agus riaracháin is gá chun an Treoir seo a chomhlíonadh, déanfaidh na Ballstáit iad a thabhairt i bhfeidhm faoin [...]. Cuirfidh siad téacs na bhforálacha sin in iúl don Choimisiún láithreach.
bl.secondParagraphOfArticle2.directive=Nuair a ghlacfaidh na Ballstáit na forálacha sin, beidh tagairt iontu don Treoir seo nó beidh tagairt den sórt sin ag gabháil leo tráth a bhfoilsithe oifigiúil. Is iad na Ballstáit a chinnfidh an bealach le tagairt den sórt sin a dhéanamh.
bl.thirdParagraphOfArticle2.directive=Déanfaidh na Ballstáit téacs phríomhfhorálacha an dlí náisiúnta a ghlacfaidh siad sa réimse a chumhdaítear leis an Treoir seo a chur in iúl don Choimisiún.
bl.firstParagraphOfArticle2Alternative.directive=Na forálacha reachtaíochta, rialúcháin agus riaracháin is gá chun an Treoir seo a chomhlíonadh, déanfaidh na Ballstáit iad a ghlacadh agus a fhoilsiú faoin [...]. Cuirfidh siad téacs na bhforálacha sin in iúl don Choimisiún láithreach.
bl.secondParagraphOfArticle2Alternative.directive=Cuirfidh siad na forálacha sin i bhfeidhm ón [...].

