# For SJ-007
bl.enactingFormula.007=TAR ÉIS AN TREOIR SEO A GHLACADH:
bl.firstParagraphOfArticle2.007=Na forálacha reachtaíochta, rialúcháin agus riaracháin is gá chun an Treoir seo a chomhlíonadh, déanfaidh na Ballstáit iad a thabhairt i bhfeidhm faoin [...]. Cuirfidh siad téacs na bhforálacha sin in iúl don Choimisiún láithreach.
bl.secondParagraphOfArticle2.007=Nuair a ghlacfaidh na Ballstáit na forálacha sin, beidh tagairt iontu don Treoir seo nó beidh tagairt den sórt sin ag gabháil leo tráth a bhfoilsithe oifigiúil. Is iad na Ballstáit a chinnfidh an bealach le tagairt den sórt sin a dhéanamh.
bl.thirdParagraphOfArticle2.007=Déanfaidh na Ballstáit téacs phríomhfhorálacha an dlí náisiúnta a ghlacfaidh siad sa réimse a chumhdaítear leis an Treoir seo a chur in iúl don Choimisiún.
bl.firstParagraphOfArticle2Alternative.007=Na forálacha reachtaíochta, rialúcháin agus riaracháin is gá chun an Treoir seo a chomhlíonadh, déanfaidh na Ballstáit iad a ghlacadh agus a fhoilsiú faoin [...]. Cuirfidh siad téacs na bhforálacha sin in iúl don Choimisiún láithreach.
bl.secondParagraphOfArticle2Alternative.007=Cuirfidh siad na forálacha sin i bhfeidhm ón [...].
bl.article3.007=Tiocfaidh an Treoir seo i bhfeidhm an [...] lá tar éis lá a foilsithe in <i>Iris Oifigiúil an Aontais Eorpaigh</i>.
bl.article4.007=Is chuig na Ballstáit a dhírítear an Treoir seo.
